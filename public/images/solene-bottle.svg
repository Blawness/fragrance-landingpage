<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
  <title id="title">Solène fragrance bottle</title>
  <desc id="desc">A glass perfume bottle with champagne liquid and Nué Solène label.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ead6aa" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#bf7d3a" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#070605" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#fff8ea" stop-opacity=".09"/>
      <stop offset="18%" stop-color="#fff8ea" stop-opacity=".42"/>
      <stop offset="45%" stop-color="#d4a35f" stop-opacity=".12"/>
      <stop offset="78%" stop-color="#fff8ea" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#fff8ea" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f1c778" stop-opacity=".52"/>
      <stop offset="100%" stop-color="#9b552e" stop-opacity=".88"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="760" height="980" fill="none"/>
  <ellipse cx="380" cy="520" rx="300" ry="420" fill="url(#halo)"/>
  <ellipse cx="380" cy="890" rx="168" ry="34" fill="#000" opacity=".45" filter="url(#soft)"/>
  <rect x="278" y="172" width="204" height="112" rx="24" fill="#ead6aa" opacity=".9"/>
  <rect x="300" y="278" width="160" height="122" rx="26" fill="#d6bc82" opacity=".75"/>
  <rect x="228" y="382" width="304" height="430" rx="82" fill="url(#glass)" stroke="#f7efe2" stroke-opacity=".34" stroke-width="3"/>
  <path d="M254 620 C330 650 430 584 506 616 L506 770 C450 804 310 804 254 770 Z" fill="url(#liquid)"/>
  <rect x="314" y="412" width="30" height="340" rx="18" fill="#fff8ea" opacity=".32"/>
  <rect x="462" y="420" width="18" height="306" rx="12" fill="#fff8ea" opacity=".18"/>
  <text x="380" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#f7efe2">Nué</text>
  <text x="380" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" letter-spacing="8" fill="#ead6aa">SOLENE</text>
